<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoLearn — the compare-first GeoGuessr clue reference</title>
<meta name="description" content="Browse GeoGuessr identification clues by country, or compare two countries side by side to see exactly what differs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%228%22%20fill%3D%22%231b1d21%22%2F%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2226%22%20r%3D%2212%22%20fill%3D%22%233b6ea8%22%2F%3E%20%3Cellipse%20cx%3D%2220%22%20cy%3D%2226%22%20rx%3D%225%22%20ry%3D%2212%22%20fill%3D%22none%22%20stroke%3D%22%23f5f5f0%22%20stroke-width%3D%221.3%22%20opacity%3D%220.85%22%2F%3E%20%3Cline%20x1%3D%228%22%20y1%3D%2226%22%20x2%3D%2232%22%20y2%3D%2226%22%20stroke%3D%22%23f5f5f0%22%20stroke-width%3D%221.3%22%20opacity%3D%220.85%22%2F%3E%20%3Cpath%20d%3D%22M10.6%2020.4%20Q%2020%2024%2029.4%2020.4%22%20fill%3D%22none%22%20stroke%3D%22%23f5f5f0%22%20stroke-width%3D%221.15%22%20opacity%3D%220.6%22%2F%3E%20%3Cpath%20d%3D%22M10.6%2031.6%20Q%2020%2035.2%2029.4%2031.6%22%20fill%3D%22none%22%20stroke%3D%22%23f5f5f0%22%20stroke-width%3D%221.15%22%20opacity%3D%220.6%22%2F%3E%20%3Cpath%20d%3D%22M13.8%2012%20L13.8%2016.4%20Q%2020%2019.4%2026.2%2016.4%20L26.2%2012%20Z%22%20fill%3D%22%23d99b2e%22%2F%3E%20%3Cpath%20d%3D%22M20%204.6%20L36%209.9%20L20%2015.2%20L4%209.9%20Z%22%20fill%3D%22%23f2c14e%22%2F%3E%20%3Cpath%20d%3D%22M34%209.4%20L34%2017.4%22%20stroke%3D%22%23c1443c%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%20%3Ccircle%20cx%3D%2234%22%20cy%3D%2219%22%20r%3D%221.8%22%20fill%3D%22%23c1443c%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GeoLearn logo: a globe wearing a graduation cap">
        <circle cx="20" cy="26" r="12" fill="#3b6ea8"/>
        <ellipse cx="20" cy="26" rx="5" ry="12" fill="none" stroke="#f5f5f0" stroke-width="1.3" opacity="0.85"/>
        <line x1="8" y1="26" x2="32" y2="26" stroke="#f5f5f0" stroke-width="1.3" opacity="0.85"/>
        <path d="M10.6 20.4 Q 20 24 29.4 20.4" fill="none" stroke="#f5f5f0" stroke-width="1.15" opacity="0.6"/>
        <path d="M10.6 31.6 Q 20 35.2 29.4 31.6" fill="none" stroke="#f5f5f0" stroke-width="1.15" opacity="0.6"/>
        <path d="M13.8 12 L13.8 16.4 Q 20 19.4 26.2 16.4 L26.2 12 Z" fill="#d99b2e"/>
        <path d="M20 4.6 L36 9.9 L20 15.2 L4 9.9 Z" fill="#f2c14e"/>
        <path d="M34 9.4 L34 17.4" stroke="#c1443c" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <circle cx="34" cy="19" r="1.8" fill="#c1443c"/>
      </svg>
      <div>
        <h1>GeoLearn</h1>
        <div class="sub">Stop memorizing. Start diffing.</div>
      </div>
    </div>
    <nav class="tabs">
      <button data-view="browse" class="active">Browse</button>
      <button data-view="compare">Compare</button>
    </nav>
  </div>
</header>

<div class="shell">

  <!-- BROWSE -->
  <section id="view-browse" class="view active">
    <div class="browse-controls">
      <input id="searchInput" class="search-input" type="text" placeholder="Search a country&hellip;">
    </div>
    <div id="regionFilter" class="region-filter" style="margin-bottom:20px;"></div>
    <div id="grid" class="grid"></div>
  </section>

  <!-- DETAIL -->
  <section id="view-detail" class="view">
    <div id="detailContent"></div>
  </section>

  <!-- COMPARE -->
  <section id="view-compare" class="view">
    <div class="compare-pickers">
      <div class="picker left">
        <select id="selectLeft"></select>
      </div>
      <div class="vs-mark">VS</div>
      <div class="picker right">
        <select id="selectRight"></select>
      </div>
    </div>
    <div id="compareOutput"></div>
  </section>

</div>

<footer class="foot">
  GeoLearn is a fan-made study reference for GeoGuessr players. Clue data is community-sourced &mdash; extend <span class="mono">data.js</span> to add more countries.
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
