<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoLearn</title>
<meta name="description" content="Browse GeoGuessr identification clues by country, or compare two countries side by side to see exactly what differs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%229%22%20fill%3D%22%231b1d21%22%2F%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2220%22%20r%3D%2213%22%20fill%3D%22none%22%20stroke%3D%22%23edeae3%22%20stroke-width%3D%221.4%22%20opacity%3D%220.92%22%2F%3E%20%3Cellipse%20cx%3D%2220%22%20cy%3D%2220%22%20rx%3D%225.4%22%20ry%3D%2213%22%20fill%3D%22none%22%20stroke%3D%22%23edeae3%22%20stroke-width%3D%220.9%22%20opacity%3D%220.42%22%2F%3E%20%3Cline%20x1%3D%227%22%20y1%3D%2220%22%20x2%3D%2233%22%20y2%3D%2220%22%20stroke%3D%22%23edeae3%22%20stroke-width%3D%220.9%22%20opacity%3D%220.42%22%2F%3E%20%3Cpath%20d%3D%22M8.7%2013.6%20Q20%2017.2%2031.3%2013.6%22%20fill%3D%22none%22%20stroke%3D%22%23edeae3%22%20stroke-width%3D%220.8%22%20opacity%3D%220.3%22%2F%3E%20%3Cpath%20d%3D%22M8.7%2026.4%20Q20%2030%2031.3%2026.4%22%20fill%3D%22none%22%20stroke%3D%22%23edeae3%22%20stroke-width%3D%220.8%22%20opacity%3D%220.3%22%2F%3E%20%3Cpath%20d%3D%22M10.5%2027.5%20Q16%204%2031.5%2011%22%20fill%3D%22none%22%20stroke%3D%22%23f2c14e%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%2F%3E%20%3Ccircle%20cx%3D%2231.5%22%20cy%3D%2211%22%20r%3D%224.6%22%20fill%3D%22%23f2c14e%22%20opacity%3D%220.2%22%2F%3E%20%3Ccircle%20cx%3D%2231.5%22%20cy%3D%2211%22%20r%3D%222.5%22%20fill%3D%22%23f2c14e%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="flightMap" class="flight-layer" aria-hidden="true"></canvas>
<canvas id="flightField" class="flight-layer" aria-hidden="true"></canvas>

<header class="top">
  <div class="inner">
    <div class="brand">
      <!-- The globe spins by squashing two meridians a quarter-turn out of phase,
           and the route redraws itself and lands on the marker. All of it is CSS
           (see .brand-mark in style.css) and all of it stops under reduced motion. -->
      <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GeoLearn logo: a wireframe globe with a route arc">
        <circle cx="20" cy="20" r="13" fill="none" stroke="#edeae3" stroke-width="1.4" opacity="0.92"/>
        <ellipse class="meridian" cx="20" cy="20" rx="13" ry="13" fill="none" stroke="#edeae3" stroke-width="0.9" opacity="0.42"/>
        <ellipse class="meridian is-b" cx="20" cy="20" rx="13" ry="13" fill="none" stroke="#edeae3" stroke-width="0.9" opacity="0.42"/>
        <line x1="7" y1="20" x2="33" y2="20" stroke="#edeae3" stroke-width="0.9" opacity="0.42"/>
        <path d="M8.7 13.6 Q20 17.2 31.3 13.6" fill="none" stroke="#edeae3" stroke-width="0.8" opacity="0.3"/>
        <path d="M8.7 26.4 Q20 30 31.3 26.4" fill="none" stroke="#edeae3" stroke-width="0.8" opacity="0.3"/>
        <path class="route" pathLength="1" d="M10.5 27.5 Q16 4 31.5 11" fill="none" stroke="#f2c14e" stroke-width="1.5" stroke-linecap="round"/>
        <circle class="pin-halo" cx="31.5" cy="11" r="4.6" fill="#f2c14e" opacity="0.2"/>
        <circle class="pin" cx="31.5" cy="11" r="2.5" fill="#f2c14e"/>
      </svg>
      <div>
        <h1>GeoLearn</h1>
        <div class="sub">Stop memorizing. Start diffing.</div>
      </div>
    </div>
    <nav class="tabs">
      <button data-view="browse" class="active">Browse</button>
      <button data-view="compare">Compare</button>
      <button data-view="guide">Guide</button>
    </nav>
  </div>
</header>

<div class="shell">

  <!-- BROWSE -->
  <section id="view-browse" class="view active">
    <div class="browse-controls">
      <input id="searchInput" class="search-input" type="text" placeholder="Search a country&hellip;">
    </div>

    <div class="globe-wrap" id="globeWrap">
      <canvas id="globeCanvas" tabindex="0" role="application"
              aria-label="Interactive globe. Drag to spin, click a country to open its clues. Arrow keys rotate, plus and minus zoom, Escape clears the selection. The country list below does the same thing without the globe."></canvas>
      <div class="globe-controls">
        <button type="button" data-globe="in" aria-label="Zoom in">+</button>
        <button type="button" data-globe="out" aria-label="Zoom out">&minus;</button>
        <button type="button" data-globe="reset" aria-label="Reset the globe">&#8635;</button>
      </div>
      <div class="globe-legend" aria-hidden="true">
        <span><i></i>Official coverage</span>
        <span><i class="is-photo-key"></i>Photospheres only</span>
        <span><i class="is-selected-key"></i>Selected</span>
        <span><i class="is-empty-key"></i>Not in the guide</span>
        <span><i class="is-dot-key"></i>Too small to draw</span>
      </div>
      <div class="globe-tip" id="globeTip" aria-hidden="true"></div>
      <div class="globe-hint" id="globeHint" aria-hidden="true"></div>
      <div class="globe-caption" id="globeCaption">Drag to spin &middot; click a country</div>
    </div>

    <div class="browse-body" id="browseBody">
      <div class="list-col">
        <div class="list-head" id="listHead"></div>
        <div id="grid" class="grid"></div>
      </div>
      <aside class="detail-col" id="detailCol" hidden>
        <div id="detailContent"></div>
      </aside>
    </div>
  </section>

  <!-- COMPARE -->
  <section id="view-compare" class="view">
    <!-- Mount points only: createCountryPicker() in picker.js builds each picker
         in full, because a searchable listbox is more markup than it is worth
         keeping in sync by hand across two sides. -->
    <div class="compare-pickers">
      <div class="picker left"><div id="pickerLeft"></div></div>
      <div class="vs-mark">VS</div>
      <div class="picker right"><div id="pickerRight"></div></div>
    </div>
    <div id="compareOutput"></div>
  </section>


  <!-- GUIDE -->
  <section id="view-guide" class="view">
    <div class="guide-layout">
      <!-- Contents rail. Chapters that aren't written yet still appear, greyed,
           so the shape of the whole book is visible from the first screen. -->
      <aside class="guide-rail" id="guideAside" aria-label="Guidebook contents">
        <!-- Stacked above the article on narrow screens, nineteen entries is a long
             scroll before the reading starts, so there the rail collapses behind this
             button. It is display:none on wide layouts, where the rail is a sidebar. -->
        <button type="button" class="rail-toggle" id="railToggle" aria-expanded="false" aria-controls="guideRail">
          <span class="rail-toggle-label">Contents</span>
          <span class="rail-toggle-current" id="railCurrent"></span>
        </button>
        <div class="rail-groups" id="guideRail"></div>
      </aside>
      <article class="guide-article" id="guideArticle" tabindex="-1"></article>
    </div>
  </section>

</div>

<footer class="foot">
  GeoLearn is a fan-made study reference for GeoGuessr players. Clue data is community-sourced &mdash; extend <span class="mono">data.js</span> to add more countries.
</footer>

<script src="data.js"></script>
<script src="guides.js"></script>
<script src="states.js"></script>
<script src="state-outlines.js"></script>
<script src="globe-data.js"></script>
<script src="flights.js"></script>
<script src="flags.js"></script>
<script src="globe.js"></script>
<script src="shields.js"></script>
<script src="picker.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>
</body>
</html>
